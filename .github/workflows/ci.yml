name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24' # unit-тесты читают .ts напрямую (нужен встроенный strip-types)
          cache: 'npm'

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Unit-тесты
        run: node --test e2e/*.test.mjs

      - name: Бот — типы и тесты
        run: |
          npx tsc -p bot/tsconfig.json
          node --test bot/test/*.test.mjs
